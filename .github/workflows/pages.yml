name: Test and deploy Rudiment to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Cargo registry and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Rust, WASM target and Trunk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install trunk --version 0.22.1 --locked
      - run: npm ci
      - run: cargo test --workspace --locked
      - name: Build root-path production assets for browser tests
        run: npm run build
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - name: Refresh generated browser assets
        run: npm run fixtures && npm run bundle
      - name: Build GitHub Pages project-path assets
        working-directory: web
        run: trunk build index.html --release --locked=true --skip-version-check --dist ../dist --public-url "/${{ github.event.repository.name }}/"
      - name: Verify deployable asset graph
        run: |
          test -s dist/index.html
          grep -q '<title>Rudiment' dist/index.html
          test -s dist/public/bridge.js
          test -s dist/public/audio/snare-medium.m4a
          test -n "$(find dist -name '*.wasm' -print -quit)"
          grep -q "/${{ github.event.repository.name }}/" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
