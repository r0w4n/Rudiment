name: Test and deploy Rudiment to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pin the image: Ubuntu 24.04 includes Rust and Google Chrome. Playwright is
    # configured to use that Chrome installation, so no browser image is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: ./.github/actions/setup-rudiment
        with:
          cargo-audit: 'true'
      - run: npm run qa:quick
      - run: npm run qa:unit
      - run: npm run qa:security
      - name: Generate browser assets
        run: |
          npm run fixtures
          npm run bundle
      - name: Build production assets once
        working-directory: web
        run: trunk build index.html --release --locked=true --skip-version-check --dist ../dist --public-url "./"
      - name: Run browser tests with runner Chrome
        run: npm run qa:browser -- --skip-build
      - name: Run accessibility gates with runner Chrome
        run: npm run qa:a11y -- --skip-build
      - name: Run release performance gates
        run: npm run qa:performance -- --skip-build
      - name: Upload browser failure comparisons
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rudiment-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rudiment-release-quality
          path: quality-results
          if-no-files-found: error
          retention-days: 14
      - name: Verify deployable asset graph
        run: |
          test -s dist/index.html
          grep -q '<title>Rudiment' dist/index.html
          test -s dist/public/bridge.js
          test -s dist/public/audio/snare-medium.m4a
          test ! -e dist/public/reference
          test -n "$(find dist -name '*.wasm' -print -quit)"
          grep -q 'href="./' dist/index.html
          grep -q "from './" dist/index.html
          ! grep -Eq '(src|href)="/' dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
