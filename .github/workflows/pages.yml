name: Test and deploy Rudiment to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pin the image: Ubuntu 24.04 includes Rust and Google Chrome. Playwright is
    # configured to use that Chrome installation, so no browser image is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Cargo registry and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Add the Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install prebuilt Trunk
        env:
          TRUNK_VERSION: 0.22.1
          TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1
        run: |
          archive="$RUNNER_TEMP/trunk.tar.gz"
          bin_dir="$RUNNER_TEMP/trunk-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${TRUNK_SHA256}  ${archive}" | sha256sum --check --status
          mkdir --parents "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - run: npm ci
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generate browser assets
        run: |
          npm run fixtures
          npm run bundle
      - name: Build production assets once
        working-directory: web
        run: trunk build index.html --release --locked=true --skip-version-check --dist ../dist --public-url "./"
      - name: Run browser tests with runner Chrome
        run: npm run test:e2e
      - name: Upload browser failure comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rudiment-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify deployable asset graph
        run: |
          test -s dist/index.html
          grep -q '<title>Rudiment' dist/index.html
          test -s dist/public/bridge.js
          test -s dist/public/audio/snare-medium.m4a
          test ! -e dist/public/reference
          test -n "$(find dist -name '*.wasm' -print -quit)"
          grep -q 'href="./' dist/index.html
          grep -q "from './" dist/index.html
          ! grep -Eq '(src|href)="/' dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
