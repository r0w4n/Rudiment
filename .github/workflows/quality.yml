name: Quality assurance

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: read

jobs:
  code-and-unit:
    name: Code quality, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rudiment
      - run: npm run qa:quick
      - run: npm run qa:unit
      - run: npm run build
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-code-and-unit
          path: quality-results
          if-no-files-found: error
          retention-days: 14

  browser-and-accessibility:
    name: Browser correctness and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rudiment
      - run: npm run qa:browser
      - run: npm run qa:a11y -- --skip-build
      - name: Upload browser and QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-browser-accessibility
          path: |
            quality-results
            test-results
          if-no-files-found: warn
          retention-days: 14
