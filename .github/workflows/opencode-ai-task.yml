name: OpenCode AI task

# Implements development tasks from GitHub issues with OpenCode Go.
#
# Authorisation model (enforced in the workflow-level condition below and again
# inside the jobs via scripts/opencode-ai-task/authorise.sh):
#   - The issue must have been created by AUTHORISED_USER.
#   - The `ai-task` label must have been applied, and only by AUTHORISED_USER.
#   - The issue must be open, must have a description, and must not be a
#     pull request.
# Any other event exits before any job runs: no model invocation, no API
# credits, and no access to the OpenCode API key (it is only ever referenced in
# the implement job, which is skipped for unauthorised events).
#
# The implement job never merges, never pushes to the default branch and never
# deploys. It creates the branch `ai/issue-<n>` and a draft pull request that
# waits for manual review. Changes touching .github/ or .githooks/ are rejected
# before anything is pushed.
#
# workflow_dispatch exists for testing: it re-checks authorisation for a given
# issue number against live repository data. dry_run=true (the default) stops
# before any model call. Dispatch mode cannot verify who applied the label
# (GitHub does not record that in issue data); it verifies issue author, label
# presence, state and duplicates only.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to check (test mode)'
        required: true
        type: string
      dry_run:
        description: 'Run authorisation checks only, without implementing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: opencode-ai-task-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  AUTHORISED_USER: r0w4n
  REQUIRED_LABEL: ai-task
  DEFAULT_MODEL: opencode-go/glm-5.3-flash

jobs:
  authorise:
    name: Check authorisation and duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.label.name == 'ai-task' &&
        github.event.sender.login == 'r0w4n' &&
        github.event.issue.user.login == 'r0w4n' &&
        github.event.issue.state == 'open' &&
        github.event.issue.body != '' &&
        !github.event.issue.pull_request
      )
    # Note: the env context is unavailable in job-level conditions, so the
    # literals above duplicate AUTHORISED_USER and REQUIRED_LABEL below. Keep
    # them in sync.
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      reason: ${{ steps.decision.outputs.reason }}
      branch: ${{ steps.decision.outputs.branch }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check authorisation and duplicates
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          # For issues events these come straight from the (trusted) event
          # context; dispatch mode overrides them below from the GitHub API.
          GATE_EVENT_LABEL: ${{ github.event.label.name }}
          GATE_ISSUE_STATE: ${{ github.event.issue.state }}
          GATE_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GATE_SENDER: ${{ github.event.sender.login }}
          GATE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          GATE_BODY_NONEMPTY: ${{ github.event.issue.body != '' }}
        run: |
          set -euo pipefail

          if ! [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::issue_number must be a numeric issue id (got '${ISSUE_NUMBER}')."
            exit 1
          fi
          BRANCH="ai/issue-${ISSUE_NUMBER}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
            export GATE_ISSUE_AUTHOR="$(jq -r '.user.login' <<<"${ISSUE_DATA}")"
            export GATE_ISSUE_STATE="$(jq -r '.state' <<<"${ISSUE_DATA}")"
            export GATE_SENDER="${{ github.actor }}"
            export GATE_IS_PULL_REQUEST="$(jq -r 'if .pull_request == null then "false" else "true" end' <<<"${ISSUE_DATA}")"
            export GATE_BODY_NONEMPTY="$(jq -r 'if ((.body // "") | length) > 0 then "true" else "false" end' <<<"${ISSUE_DATA}")"
            if jq -e --arg label "${REQUIRED_LABEL}" '.labels[] | select(.name == $label)' >/dev/null 2>&1 <<<"${ISSUE_DATA}"; then
              export GATE_EVENT_LABEL="${REQUIRED_LABEL}"
            else
              export GATE_EVENT_LABEL=""
            fi
            echo "Dispatch mode: labeler identity cannot be verified; checking issue author, label presence, state and duplicates."
          fi

          export GATE_REQUIRED_AUTHOR="${AUTHORISED_USER}"
          export GATE_REQUIRED_LABEL="${REQUIRED_LABEL}"

          GATE_OUT="$(bash scripts/opencode-ai-task/authorise.sh)"
          echo "${GATE_OUT}"
          PROCEED="$(sed -n 's/^proceed=\([a-z]*\).*/\1/p' <<<"${GATE_OUT}")"
          REASON="$(sed -n 's/^proceed=[a-z]* reason=\(.*\)$/\1/p' <<<"${GATE_OUT}")"

          if [ "${PROCEED}" = "true" ]; then
            # Duplicate prevention: one branch and one open pull request per issue.
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
              OPEN_PRS="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq 'length')"
              if [ "${OPEN_PRS}" -gt 0 ]; then
                echo "::notice::Issue #${ISSUE_NUMBER} already has an active task: branch ${BRANCH} and an open pull request exist. Nothing to do."
                PROCEED="false"
                REASON="duplicate: branch ${BRANCH} and an open pull request already exist"
              else
                echo "::error::Branch ${BRANCH} exists without an open pull request: a previous run did not complete. Delete the branch to retrigger: git push origin --delete ${BRANCH}"
                exit 1
              fi
            fi
          fi

          {
            echo "proceed=${PROCEED}"
            echo "reason=${REASON}"
            echo "branch=${BRANCH}"
          } >>"${GITHUB_OUTPUT}"

  implement:
    name: Implement with OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: authorise
    if: >-
      needs.authorise.outputs.proceed == 'true' &&
      (
        github.event_name == 'issues' ||
        inputs.dry_run == false
      )
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BRANCH: ${{ needs.authorise.outputs.branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Prepare task workspace
        run: |
          set -euo pipefail
          # The env and runner contexts are unavailable in job-level env, so the
          # model selection and file paths are published here for later steps.
          MODEL="${{ vars.OPENCODE_AI_TASK_MODEL }}"
          if [ -z "${MODEL}" ]; then
            MODEL="${DEFAULT_MODEL}"
          fi
          {
            echo "MODEL=${MODEL}"
            echo "SPEC_FILE=${RUNNER_TEMP}/opencode-issue-spec.md"
            echo "INSTRUCTIONS_FILE=${RUNNER_TEMP}/opencode-instructions.txt"
            echo "PR_SUMMARY_FILE=${RUNNER_TEMP}/opencode-pr-summary.md"
            echo "PR_BODY_FILE=${RUNNER_TEMP}/opencode-pr-body.md"
            echo "ISSUE_TITLE_FILE=${RUNNER_TEMP}/opencode-issue-title.txt"
          } >>"${GITHUB_ENV}"
          echo "Task workspace prepared (model: ${MODEL})"

      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "opencode-ai-task[bot]"
          git config user.email "opencode-ai-task[bot]@users.noreply.github.com"

      - name: Re-check authorisation
        env:
          GATE_EVENT_LABEL: ${{ github.event.label.name }}
          GATE_ISSUE_STATE: ${{ github.event.issue.state }}
          GATE_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GATE_SENDER: ${{ github.event.sender.login }}
          GATE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          GATE_BODY_NONEMPTY: ${{ github.event.issue.body != '' }}
          GATE_REQUIRED_AUTHOR: ${{ env.AUTHORISED_USER }}
          GATE_REQUIRED_LABEL: ${{ env.REQUIRED_LABEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GATE_ISSUE_AUTHOR}" ]; then
            # Dispatch mode: derive the inputs the authorise job derived.
            ISSUE_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
            export GATE_ISSUE_AUTHOR="$(jq -r '.user.login' <<<"${ISSUE_DATA}")"
            export GATE_ISSUE_STATE="$(jq -r '.state' <<<"${ISSUE_DATA}")"
            export GATE_SENDER="${{ github.actor }}"
            export GATE_IS_PULL_REQUEST="$(jq -r 'if .pull_request == null then "false" else "true" end' <<<"${ISSUE_DATA}")"
            export GATE_BODY_NONEMPTY="$(jq -r 'if ((.body // "") | length) > 0 then "true" else "false" end' <<<"${ISSUE_DATA}")"
            if jq -e --arg label "${GATE_REQUIRED_LABEL}" '.labels[] | select(.name == $label)' >/dev/null 2>&1 <<<"${ISSUE_DATA}"; then
              export GATE_EVENT_LABEL="${GATE_REQUIRED_LABEL}"
            else
              export GATE_EVENT_LABEL=""
            fi
          fi
          GATE_OUT="$(bash scripts/opencode-ai-task/authorise.sh)"
          echo "${GATE_OUT}"
          if ! grep -q '^proceed=true' <<<"${GATE_OUT}"; then
            echo "::error::Authorisation no longer holds; stopping."
            exit 1
          fi

      - name: Fetch issue specification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json title --jq '.title' >"${ISSUE_TITLE_FILE}"
          {
            echo "# Issue #${ISSUE_NUMBER} development specification"
            echo
            gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --json title,body --jq '"## " + .title + "\n\n" + (.body // "")'
          } >"${SPEC_FILE}"
          echo "Specification written to ${SPEC_FILE}"
          rm -f "${PR_SUMMARY_FILE}"

      - name: Install OpenCode
        run: |
          npm install -g --allow-scripts=@opencode/cli @opencode/cli
          opencode --version

      - name: Implement the task
        timeout-minutes: 45
        env:
          # The opencode-go provider resolves its credential from
          # OPENCODE_API_KEY (environment auth method), as proven by the
          # OpenCode Go connectivity smoke test.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -euo pipefail
          echo "Model: ${MODEL}"
          echo "Branch: ${BRANCH}"

          cat >"${INSTRUCTIONS_FILE}" <<EOF
          You are implementing a development task in the Rudiment repository for GitHub issue ${ISSUE_NUMBER}.

          The issue title and description are attached to this message as a file. Treat the attachment as the requirement specification. Work from the current repository checkout, which is on the default branch with a clean tree.

          Required workflow:
          1. Create and switch to a new branch named exactly: ${BRANCH}
          2. Read AGENTS.md and follow the repository's architecture, presentation-boundary, style and QA conventions.
          3. Implement the requested changes. Keep the change minimal and focused on the specification.
          4. Run the relevant validation for the files you changed, following the QA section of AGENTS.md. Do not run the full qa:full suite unless the specification requires it.
          5. Commit all of your changes to the branch with a conventional commit message that references issue ${ISSUE_NUMBER}.
          6. When done, write a pull request summary to the file ${PR_SUMMARY_FILE} covering: what changed and why, the tests and validation you ran with their results, and any limitations or follow-up work.

          Hard constraints:
          - Do NOT push, do NOT create pull requests or issues, and do NOT merge anything. The automation around you handles all git integration.
          - Do NOT create git worktrees and do NOT use worktree-related tooling.
          - Do NOT modify anything under .github/ or .githooks/, and do not attempt to change CI workflows, secrets, hooks or security configuration. If the specification appears to require that, stop and record it in the summary instead.
          - Do not modify files unrelated to the specification.
          - Leave the working tree clean and committed on ${BRANCH} when you finish.
          EOF

          opencode run --auto --archived --model "${MODEL}" \
            --file "${SPEC_FILE}" \
            "$(cat "${INSTRUCTIONS_FILE}")"

      - name: Verify and guard the result
        run: |
          set -euo pipefail
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "${CURRENT_BRANCH}" != "${BRANCH}" ]; then
            echo "::error::OpenCode did not create or switch to branch ${BRANCH} (still on '${CURRENT_BRANCH}')."
            exit 1
          fi

          COMMIT_COUNT="$(git rev-list --count "origin/${DEFAULT_BRANCH}..HEAD")"
          if [ "${COMMIT_COUNT}" -lt 1 ]; then
            echo "::error::No commits were made on ${BRANCH}."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::OpenCode left uncommitted changes:"
            git status --porcelain
            exit 1
          fi

          FORBIDDEN="$(git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD" -- .github/ .githooks/ || true)"
          if [ -n "${FORBIDDEN}" ]; then
            echo "::error::The implementation modified protected CI or security paths. Pushing is blocked pending manual approval:"
            echo "${FORBIDDEN}"
            exit 1
          fi

          {
            echo "## OpenCode AI task — issue #${ISSUE_NUMBER}"
            echo
            echo "Branch: \`${BRANCH}\` — commits:"
            echo
            git log --oneline "origin/${DEFAULT_BRANCH}..HEAD"
            echo
            echo "Changed files:"
            echo
            '```'
            git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD"
            '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Push branch and open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE_TITLE="$(cat "${ISSUE_TITLE_FILE}")"

          if [ -f "${PR_SUMMARY_FILE}" ]; then
            SUMMARY="$(cat "${PR_SUMMARY_FILE}")"
          else
            SUMMARY="_(OpenCode did not produce a summary file; see the workflow run log for details.)_"
          fi

          {
            echo "## Summary"
            echo
            echo "${SUMMARY}"
            echo
            echo "## Automation notes"
            echo
            echo "- Created automatically by OpenCode from issue #${ISSUE_NUMBER} (model: \`${MODEL}\`)."
            echo "- Draft pull request: nothing is merged, deployed or pushed to \`${DEFAULT_BRANCH}\` until you review and approve it."
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } >"${PR_BODY_FILE}"

          # Git authentication is established only here, after the model has
          # finished, so the OpenCode process never sees GitHub credentials.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          gh pr create --draft \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --title "ai: issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body-file "${PR_BODY_FILE}"

      - name: Collect failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          DIAG="${RUNNER_TEMP}/opencode-diagnostics"
          mkdir -p "${DIAG}"
          if [ -d "$HOME/.local/share/opencode/log" ]; then
            cp -R "$HOME/.local/share/opencode/log" "${DIAG}/opencode-log" || true
          fi
          if git rev-parse HEAD >/dev/null 2>&1; then
            git diff "origin/${DEFAULT_BRANCH}...HEAD" >"${DIAG}/diff.patch" 2>/dev/null || true
            git status --porcelain >"${DIAG}/status.txt" 2>/dev/null || true
          fi
          cp -f "${SPEC_FILE}" "${DIAG}/" 2>/dev/null || true
          [ -f "${PR_SUMMARY_FILE}" ] && cp -f "${PR_SUMMARY_FILE}" "${DIAG}/" || true
          echo "Diagnostics collected in ${DIAG}"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-task-issue-${{ github.event.issue.number || inputs.issue_number }}-diagnostics
          path: ${{ runner.temp }}/opencode-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/failure-comment.md" <<EOF
          The OpenCode AI task for this issue failed before a draft pull request could be opened.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Diagnostics (OpenCode logs, specification, partial summary, diff) are attached to the run as artifacts. Nothing was merged, pushed to \`${DEFAULT_BRANCH}\` or deployed. If the branch \`${BRANCH}\` was pushed, delete it to retrigger the task.
          EOF
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/failure-comment.md"
