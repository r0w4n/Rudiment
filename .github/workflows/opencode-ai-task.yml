name: OpenCode AI task

# Implements development tasks from GitHub issues with OpenCode Go, in four
# isolated stages:
#
#   A. authorise  (read-only)   issue author, ai-task label + labeler, open,
#                               non-empty description, non-PR; duplicate
#                               prevention. No model invocation, no secrets.
#   B. implement  (read-only)   version-pinned OpenCode, no GitHub write
#                               credential, exports committed changes as a
#                               restricted patch artifact (no .git metadata,
#                               hooks, configuration or credentials).
#   C. validate   (read-only)   fresh runner + trusted base checkout; trusted
#                               script verifies artifact integrity and applies
#                               the patches with hooks disabled, rejecting
#                               protected paths, symlinks, submodules, .git
#                               paths, traversal and malformed patches. All
#                               failures are fail-closed.
#   D. publish    (write)       fresh runner; re-applies the validated
#                               artifact to a fresh clone, revalidates, then
#                               pushes ai/issue-<n> and opens a draft PR.
#                               Never merges, never force-pushes, never
#                               touches the default branch.
#
# Trust boundaries:
#   - Scripts that run after the agent has executed come from a snapshot taken
#     before the agent started, or from the trusted base checkout — an
#     AI-modified script on the task branch cannot replace them.
#   - Unauthorised events skip every job before any secret is referenced.
#   - The agent process never receives a GitHub credential, and the agent's
#     working tree (including .git) never leaves the implement job.
#
# CI on AI-generated pull requests (GitHub documentation, "Events that trigger
# workflows"): pull_request runs created with GITHUB_TOKEN are held and
# require approval from a user with write access, approved from the pull
# request page. Pending runs report no status, so required status checks
# cannot pass until approved and successful. Requires Settings > Actions >
# Workflow permissions > "Allow GitHub Actions to create and approve pull
# requests" to be enabled for the publish job to create the PR at all.
#
# workflow_dispatch provides a dry-run test mode (default true) that only runs
# the authorisation checks; it cannot verify who applied the label, so it
# checks issue author, label presence, state and duplicates only.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to check (test mode)'
        required: true
        type: string
      dry_run:
        description: 'Run authorisation checks only, without implementing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: opencode-ai-task-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  AUTHORISED_USER: r0w4n
  REQUIRED_LABEL: ai-task
  DEFAULT_MODEL: opencode-go/glm-5.3-flash
  # Pinned to a tested release; bump deliberately after CI verification.
  OPENCODE_CLI_VERSION: '2.3.2'

jobs:
  # ---------------------------------------------------------------------------
  # A. Authorisation (read-only)
  # ---------------------------------------------------------------------------
  authorise:
    name: A. Check authorisation and duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.label.name == 'ai-task' &&
        github.event.sender.login == 'r0w4n' &&
        github.event.issue.user.login == 'r0w4n' &&
        github.event.issue.state == 'open' &&
        github.event.issue.body != '' &&
        !github.event.issue.pull_request
      )
    # The env context is unavailable in job-level conditions, so the literals
    # above duplicate AUTHORISED_USER and REQUIRED_LABEL below. Keep in sync.
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      reason: ${{ steps.decision.outputs.reason }}
      branch: ${{ steps.decision.outputs.branch }}
      base_sha: ${{ github.sha }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check authorisation and duplicates
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          # For issues events these come straight from the (trusted) event
          # context; dispatch mode overrides them below from the GitHub API.
          GATE_EVENT_LABEL: ${{ github.event.label.name }}
          GATE_ISSUE_STATE: ${{ github.event.issue.state }}
          GATE_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GATE_SENDER: ${{ github.event.sender.login }}
          GATE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          GATE_BODY_NONEMPTY: ${{ github.event.issue.body != '' }}
        run: |
          set -euo pipefail

          if ! [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::issue_number must be a numeric issue id (got '${ISSUE_NUMBER}')."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
            export GATE_ISSUE_AUTHOR="$(jq -r '.user.login' <<<"${ISSUE_DATA}")"
            export GATE_ISSUE_STATE="$(jq -r '.state' <<<"${ISSUE_DATA}")"
            export GATE_SENDER="${{ github.actor }}"
            export GATE_IS_PULL_REQUEST="$(jq -r 'if .pull_request == null then "false" else "true" end' <<<"${ISSUE_DATA}")"
            export GATE_BODY_NONEMPTY="$(jq -r 'if ((.body // "") | length) > 0 then "true" else "false" end' <<<"${ISSUE_DATA}")"
            if jq -e --arg label "${REQUIRED_LABEL}" '.labels[] | select(.name == $label)' >/dev/null 2>&1 <<<"${ISSUE_DATA}"; then
              export GATE_EVENT_LABEL="${REQUIRED_LABEL}"
            else
              export GATE_EVENT_LABEL=""
            fi
            echo "Dispatch mode: labeler identity cannot be verified; checking issue author, label presence, state and duplicates."
          fi

          export GATE_REQUIRED_AUTHOR="${AUTHORISED_USER}"
          export GATE_REQUIRED_LABEL="${REQUIRED_LABEL}"

          GATE_OUT="$(bash scripts/opencode-ai-task/authorise.sh)"
          echo "${GATE_OUT}"
          PROCEED="$(sed -n 's/^proceed=\([a-z]*\).*/\1/p' <<<"${GATE_OUT}")"
          REASON="$(sed -n 's/^proceed=[a-z]* reason=\(.*\)$/\1/p' <<<"${GATE_OUT}")"

          if [ "${PROCEED}" = "true" ]; then
            if bash scripts/opencode-ai-task/dedup-check.sh "${ISSUE_NUMBER}"; then
              :
            else
              DEDUP_RC=$?
              # 3 = active task exists (skip); 2 = stale branch (error); 1 = query error.
              if [ "${DEDUP_RC}" -eq 3 ]; then
                PROCEED="false"
                REASON="duplicate: branch ai/issue-${ISSUE_NUMBER} and an open pull request already exist"
              elif [ "${DEDUP_RC}" -eq 2 ]; then
                exit 1
              else
                echo "::error::Duplicate check query failed."
                exit 1
              fi
            fi
          fi

          {
            echo "proceed=${PROCEED}"
            echo "reason=${REASON}"
            echo "branch=ai/issue-${ISSUE_NUMBER}"
          } >>"${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # B. Implementation (no GitHub write credentials)
  # ---------------------------------------------------------------------------
  implement:
    name: B. Implement with OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: authorise
    if: >-
      needs.authorise.outputs.proceed == 'true' &&
      (
        github.event_name == 'issues' ||
        inputs.dry_run == false
      )
    permissions:
      contents: read
      issues: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BRANCH: ${{ needs.authorise.outputs.branch }}
      BASE_SHA: ${{ needs.authorise.outputs.base_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Prepare task workspace
        run: |
          set -euo pipefail
          # The env and runner contexts are unavailable in job-level env, so
          # the model selection and file paths are published here.
          MODEL="${{ vars.OPENCODE_AI_TASK_MODEL }}"
          if [ -z "${MODEL}" ]; then
            MODEL="${DEFAULT_MODEL}"
          fi
          {
            echo "MODEL=${MODEL}"
            echo "SPEC_FILE=${RUNNER_TEMP}/opencode-issue-spec.md"
            echo "INSTRUCTIONS_FILE=${RUNNER_TEMP}/opencode-instructions.txt"
            echo "PR_SUMMARY_FILE=${RUNNER_TEMP}/opencode-pr-summary.md"
            echo "ISSUE_TITLE_FILE=${RUNNER_TEMP}/opencode-issue-title.txt"
            echo "ARTIFACT_DIR=${RUNNER_TEMP}/opencode-implementation"
            echo "TRUSTED_SCRIPTS=${RUNNER_TEMP}/trusted-opencode-ai-task"
          } >>"${GITHUB_ENV}"
          echo "Task workspace prepared (model: ${MODEL})"

      - name: Check out base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorise.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Snapshot trusted automation scripts
        run: |
          set -euo pipefail
          # Everything this job executes after the agent has run comes from
          # this snapshot, taken before the agent process starts, so an
          # AI-modified script in the working tree cannot change behaviour.
          rm -rf "${TRUSTED_SCRIPTS}"
          cp -R scripts/opencode-ai-task "${TRUSTED_SCRIPTS}"
          echo "Trusted scripts snapshotted to ${TRUSTED_SCRIPTS}"

      - name: Configure git identity
        run: |
          git config user.name "opencode-ai-task[bot]"
          git config user.email "opencode-ai-task[bot]@users.noreply.github.com"

      - name: Re-check authorisation
        env:
          GATE_EVENT_LABEL: ${{ github.event.label.name }}
          GATE_ISSUE_STATE: ${{ github.event.issue.state }}
          GATE_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GATE_SENDER: ${{ github.event.sender.login }}
          GATE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          GATE_BODY_NONEMPTY: ${{ github.event.issue.body != '' }}
          GATE_REQUIRED_AUTHOR: ${{ env.AUTHORISED_USER }}
          GATE_REQUIRED_LABEL: ${{ env.REQUIRED_LABEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GATE_ISSUE_AUTHOR}" ]; then
            # Dispatch mode: derive the inputs the authorise job derived.
            ISSUE_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
            export GATE_ISSUE_AUTHOR="$(jq -r '.user.login' <<<"${ISSUE_DATA}")"
            export GATE_ISSUE_STATE="$(jq -r '.state' <<<"${ISSUE_DATA}")"
            export GATE_SENDER="${{ github.actor }}"
            export GATE_IS_PULL_REQUEST="$(jq -r 'if .pull_request == null then "false" else "true" end' <<<"${ISSUE_DATA}")"
            export GATE_BODY_NONEMPTY="$(jq -r 'if ((.body // "") | length) > 0 then "true" else "false" end' <<<"${ISSUE_DATA}")"
            if jq -e --arg label "${GATE_REQUIRED_LABEL}" '.labels[] | select(.name == $label)' >/dev/null 2>&1 <<<"${ISSUE_DATA}"; then
              export GATE_EVENT_LABEL="${GATE_REQUIRED_LABEL}"
            else
              export GATE_EVENT_LABEL=""
            fi
          fi
          GATE_OUT="$(bash scripts/opencode-ai-task/authorise.sh)"
          echo "${GATE_OUT}"
          if ! grep -q '^proceed=true' <<<"${GATE_OUT}"; then
            echo "::error::Authorisation no longer holds; stopping."
            exit 1
          fi

      - name: Fetch issue specification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json title --jq '.title' >"${ISSUE_TITLE_FILE}"
          {
            echo "# Issue #${ISSUE_NUMBER} development specification"
            echo
            gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --json title,body --jq '"## " + .title + "\n\n" + (.body // "")'
          } >"${SPEC_FILE}"
          echo "Specification written to ${SPEC_FILE}"
          rm -f "${PR_SUMMARY_FILE}"

      - name: Install pinned OpenCode
        run: |
          npm install -g --allow-scripts=@opencode/cli "@opencode/cli@${OPENCODE_CLI_VERSION}"
          opencode --version

      - name: Implement the task
        timeout-minutes: 45
        env:
          # The opencode-go provider resolves its credential from
          # OPENCODE_API_KEY (environment auth method). No GitHub token is
          # present in this step's environment.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -euo pipefail
          echo "Model: ${MODEL}"
          echo "Branch: ${BRANCH}"
          echo "Base: ${BASE_SHA}"

          cat >"${INSTRUCTIONS_FILE}" <<EOF
          You are implementing a development task in the Rudiment repository for GitHub issue ${ISSUE_NUMBER}.

          The issue title and description are attached to this message as a file. Treat the attachment as the requirement specification. Work from the current repository checkout, which is pinned to a fixed base commit with a clean tree.

          Required workflow:
          1. Create and switch to a new branch named exactly: ${BRANCH}
          2. Read AGENTS.md and follow the repository's architecture, presentation-boundary, style and QA conventions.
          3. Implement the requested changes. Keep the change minimal and focused on the specification.
          4. Run the relevant validation for the files you changed, following the QA section of AGENTS.md. Do not run the full qa:full suite unless the specification requires it.
          5. Commit all of your changes to the branch with a conventional commit message that references issue ${ISSUE_NUMBER}. Keep history linear: no merge commits.
          6. When done, write a pull request summary to the file ${PR_SUMMARY_FILE} covering: what changed and why, the tests and validation you ran with their results, and any limitations or follow-up work.

          Hard constraints:
          - Do NOT push, do NOT create pull requests or issues, and do NOT merge anything. The automation around you handles all git integration.
          - Do NOT create git worktrees and do NOT use worktree-related tooling.
          - Do NOT modify anything under .github/, .githooks/ or scripts/opencode-ai-task/, and do not attempt to change CI workflows, secrets, hooks, security tooling or repository configuration. If the specification appears to require that, stop and record it in the summary instead; such changes are rejected automatically.
          - Do not modify files unrelated to the specification.
          - Leave the working tree clean and committed on ${BRANCH} when you finish.
          EOF

          opencode run --auto --archived --model "${MODEL}" \
            --file "${SPEC_FILE}" \
            "$(cat "${INSTRUCTIONS_FILE}")"

      - name: Export changes as restricted artifact
        run: |
          set -euo pipefail
          # Runs from the trusted snapshot, not from the agent-modified tree.
          bash "${TRUSTED_SCRIPTS}/export-changes.sh"

      - name: Upload implementation artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-implementation
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 7

      - name: Collect and redact failure diagnostics
        id: diagnostics
        if: failure()
        run: |
          set -euo pipefail
          DIAG="${RUNNER_TEMP}/opencode-diagnostics"
          rm -rf "${DIAG}"
          mkdir -p "${DIAG}"
          # Minimal, deliberately selected diagnostics: the tail of the
          # newest agent log rather than the raw log directory.
          if [ -d "$HOME/.local/share/opencode/log" ]; then
            LATEST_LOG="$(ls -t "$HOME/.local/share/opencode/log/"*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "${LATEST_LOG}" ]; then
              tail -n 200 "${LATEST_LOG}" >"${DIAG}/opencode-log-tail.txt"
            fi
          fi
          if git rev-parse HEAD >/dev/null 2>&1; then
            git diff "${BASE_SHA}...HEAD" >"${DIAG}/diff.patch" 2>/dev/null || true
            git status --porcelain >"${DIAG}/status.txt" 2>/dev/null || true
          fi
          if [ -n "${SPEC_FILE:-}" ] && [ -f "${SPEC_FILE}" ]; then
            cp -f "${SPEC_FILE}" "${DIAG}/"
          fi
          if [ -n "${PR_SUMMARY_FILE:-}" ] && [ -f "${PR_SUMMARY_FILE}" ]; then
            cp -f "${PR_SUMMARY_FILE}" "${DIAG}/"
          fi
          # Fail closed: if redaction does not succeed, the upload step below
          # is skipped and no diagnostics leave the runner.
          bash "${TRUSTED_SCRIPTS}/redact.sh" "${DIAG}"

      - name: Upload failure diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: opencode-task-issue-${{ github.event.issue.number || inputs.issue_number }}-diagnostics
          path: ${{ runner.temp }}/opencode-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # C. Validation (fresh runner, trusted scripts, read-only)
  # ---------------------------------------------------------------------------
  validate:
    name: C. Validate implementation artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [authorise, implement]
    if: >-
      needs.authorise.outputs.proceed == 'true' &&
      (
        github.event_name == 'issues' ||
        inputs.dry_run == false
      )
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BRANCH: ${{ needs.authorise.outputs.branch }}
      BASE_SHA: ${{ needs.authorise.outputs.base_sha }}
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorise.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download implementation artifact
        uses: actions/download-artifact@v7
        with:
          name: opencode-implementation
          path: ${{ runner.temp }}/opencode-implementation

      - name: Validate and re-export
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/opencode-implementation
          TRUSTED_REPO: ${{ github.workspace }}
          WORK_DIR: ${{ runner.temp }}/validate-work
          VALIDATED_OUT: ${{ runner.temp }}/opencode-validated
        run: |
          set -euo pipefail
          # The script comes from the trusted checkout at the base revision,
          # never from the artifact. Any failure stops the workflow here.
          bash scripts/opencode-ai-task/validate-changes.sh

      - name: Upload validated artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-validated
          path: ${{ runner.temp }}/opencode-validated
          retention-days: 7

  # ---------------------------------------------------------------------------
  # D. Publication (fresh runner, scoped write permissions)
  # ---------------------------------------------------------------------------
  publish:
    name: D. Push branch and open draft pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [authorise, implement, validate]
    if: >-
      needs.authorise.outputs.proceed == 'true' &&
      (
        github.event_name == 'issues' ||
        inputs.dry_run == false
      )
    permissions:
      contents: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BRANCH: ${{ needs.authorise.outputs.branch }}
      BASE_SHA: ${{ needs.authorise.outputs.base_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorise.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download validated artifact
        uses: actions/download-artifact@v7
        with:
          name: opencode-validated
          path: ${{ runner.temp }}/opencode-validated

      - name: Apply and revalidate
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/opencode-validated
          TRUSTED_REPO: ${{ github.workspace }}
          WORK_DIR: ${{ runner.temp }}/publish-work
        run: |
          set -euo pipefail
          # Applies the validated patches with hooks and credential helpers
          # disabled and re-runs the full validation. The push below only
          # happens if this succeeds.
          WORK="$(bash scripts/opencode-ai-task/apply-validated.sh | sed -n 's/^WORK=//p')"
          echo "PUBLISH_WORK=${WORK}" >>"${GITHUB_ENV}"

      - name: Push branch and open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUBLISH_WORK: ${{ env.PUBLISH_WORK }}
          ARTIFACT_DIR: ${{ runner.temp }}/opencode-validated
          BRANCH: ${{ env.BRANCH }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          BASE_SHA: ${{ env.BASE_SHA }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The publication sequence (metadata validation, pull request body
          # built from the validated artifact, askpass push, draft pull
          # request, orphaned-branch cleanup) lives in the trusted checkout
          # and fails closed before any push.
          bash scripts/opencode-ai-task/publish-pr.sh

  # ---------------------------------------------------------------------------
  # Failure notification (comment on the issue; nothing else)
  # ---------------------------------------------------------------------------
  notify:
    name: Report failure on the issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [authorise, implement, validate, publish]
    if: >-
      always() &&
      failure() &&
      needs.authorise.outputs.proceed == 'true' &&
      github.event_name == 'issues'
    permissions:
      issues: write
      contents: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: ${{ needs.authorise.outputs.branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out notification script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Comment on the issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # Job results are passed in through the environment; the notification
          # script uses plain shell variables only.
          IMPLEMENT_RESULT: ${{ needs.implement.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/opencode-ai-task/notify-failure.sh
