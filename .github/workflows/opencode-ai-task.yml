name: OpenCode AI task

# The reusable workflow is pinned to the reviewed release commit of
# r0w4n/central-ai-workflow. This provisional immutable pin is the head of
# central PR #5; replace it with that PR's reviewed main commit before taking
# this migration out of draft or merging it. See central docs/RELEASING.md.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to check or implement
        required: true
        type: string
      dry_run:
        description: Run authorisation checks only
        required: false
        default: true
        type: boolean

# The reusable workflow narrows these permissions per job. GitHub does not
# permit a called workflow to elevate beyond its caller.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-task:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-task'
    uses: r0w4n/central-ai-workflow/.github/workflows/opencode-ai-task.yml@cd0af4e3b5e9c8a0a66d3b27b17376c39762fc82
    with:
      issue_number: ${{ format('{0}', github.event.issue.number || inputs.issue_number) }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # Run Rudiment's local setup action. It installs and verifies the
      # development environment without redundantly compiling the application.
      setup: true
      # AI pull requests are created ready for review; merging stays manual.
      draft: false
    secrets:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      # GitHub App publication credentials. Pull requests created with the
      # resulting App token start this repository's PR workflows
      # automatically instead of being held for approval. The App must be
      # installed on this repository with contents: write and pull requests:
      # write. See docs/ai-pr-previews.md for the one-time configuration.
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
