name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/security.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/security.yml

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  rustsec:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high
