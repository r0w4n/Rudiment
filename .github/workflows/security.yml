name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/security.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  dependencies:
    name: npm and RustSec advisory audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rudiment
        with:
          trunk: 'false'
          cargo-audit: 'true'
      - run: npm run qa:security
      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-dependency-security
          path: quality-results
          if-no-files-found: error
          retention-days: 30
