name: AI CI remediation router

# Closed-loop CI remediation for AI-generated pull requests. This workflow is
# a thin, Rudiment-owned event router: it forwards completed check outcomes of
# the app's PR checks to the pinned Central AI workflow, which owns all
# remediation policy, state, agent execution and publication.
#
# - On a failed check of an AI PR, it waits for concurrently running checks to
#   quiesce, then dispatches the AI task workflow in remediation mode so one
#   agent sees every failure of that head.
# - On a green completion it closes an open remediation episode and marks the
#   PR ready for human review (Central decides; no-op without an episode).
# - Manual dispatch recovers AI PRs that failed before this router existed,
#   using the same authorisation as automatic triggers.
#
# Human-created PRs, forks, and non-AI branches exit immediately. Nothing here
# approves, merges or pushes to main, and the router never runs PR code: it
# only calls GitHub APIs and dispatches the pinned, reviewed AI task workflow.

on:
  workflow_run:
    workflows:
      - Quality assurance
      - Performance regression checks
      - CodeQL static security analysis
      - Dependency security
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Recover an existing AI pull request by evaluating its current head
        required: true
        type: string
      dry_run:
        description: Evaluate and report without dispatching remediation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  # actions: write dispatches the pinned AI task workflow.
  actions: write
  # Listing check runs of the evaluated head commit goes through the Checks
  # API, which requires the separate 'checks: read' GITHUB_TOKEN scope.
  checks: read

concurrency:
  # One evaluation per PR branch; completions arrive per workflow, so runs
  # queue briefly and re-verify state before dispatching.
  group: ai-ci-remediation-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: false

env:
  AUTOMATION_PR_AUTHOR: central-ai-publisher[bot]
  APPROVED_BASE_BRANCH: main
  AI_TASK_WORKFLOW: opencode-ai-task.yml
  REMEDIATION_MAX_ATTEMPTS: '3'
  # Failing-check retrieval and episode accounting happen in Central; this
  # router only forwards the event and its head identity.
  QUIESCE_TIMEOUT_SECONDS: '1080'
  QUIESCE_POLL_SECONDS: '60'
  # Forwarded to Central through the remediation_run_id input for diagnostics.
  REMEDIATION_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  evaluate:
    name: Evaluate completed checks and dispatch remediation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # timed_out and startup_failure are actionable workflow conclusions too;
    # per-check conclusions (including these) are evaluated in the script.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    steps:
      - name: Evaluate checks and dispatch the AI task workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          auth_pr_for_branch() {
            # Resolve the open AI PR owning a head branch; verifies author,
            # base and same-repository head. Prints the PR JSON, returns 1
            # when no authorised PR matches, and returns 2 when the API
            # request itself failed (never treated as "no PR").
            local branch="$1" owner="${REPOSITORY%%/*}" pr_json
            # The pulls-list 'head' filter expects '<owner>:<branch>' — the
            # owner only, not the full repository name. gh encodes the query
            # parameters safely.
            if ! pr_json="$(gh api "repos/${REPOSITORY}/pulls" \
                -f state=open -f head="${owner}:${branch}" --jq '.[0] // empty')"; then
              echo "::error::PR lookup for ${owner}:${branch} failed (GET /repos/${REPOSITORY}/pulls?head=${owner}:${branch}&state=open); no remediation decision can be made from a failed API request." >&2
              return 2
            fi
            [ -n "${pr_json}" ] || return 1
            if ! jq -e --arg author "${AUTOMATION_PR_AUTHOR}" --arg base "${APPROVED_BASE_BRANCH}" \
                --arg repository "${REPOSITORY}" \
                '.user.login == $author and .base.ref == $base
                 and .head.repo.full_name == $repository
                 and (.head.ref | test("^ai/issue-[0-9]+$"))' \
                <<<"${pr_json}" >/dev/null; then
              echo "::notice::PR on ${branch} is not an authorised AI pull request (author, base, fork or branch mismatch); nothing to do." >&2
              return 1
            fi
            printf '%s' "${pr_json}"
          }

          head_of_pr() {
            local pr_number="$1" head
            if ! head="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')"; then
              echo "::error::Could not read PR #${pr_number} (GET /repos/${REPOSITORY}/pulls/${pr_number})." >&2
              exit 1
            fi
            printf '%s' "${head}"
          }

          list_check_runs() {
            # One TSV row per check run of the head; fails loudly so an API
            # error can never be mistaken for "no pending" or "no failing"
            # checks. Job needs 'checks: read' for this endpoint.
            local sha="$1"
            gh api --paginate "repos/${REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.status, (.conclusion // ""), (.name // "")] | @tsv' || {
              echo "::error::Could not list check runs for ${sha:0:12} (GET /repos/${REPOSITORY}/commits/<sha>/check-runs); the router needs 'checks: read'." >&2
              return 2
            }
          }

          quiesce_checks() {
            # Wait until no check run of the head is pending, re-verifying the
            # PR head so a superseded commit never dispatches remediation.
            local sha="$1" pr_number="$2" elapsed=0 pending
            while :; do
              local current_head
              current_head="$(head_of_pr "${pr_number}")"
              [ "${current_head}" = "${sha}" ] || {
                echo "::notice::PR #${pr_number} head moved during evaluation; dropping stale event."
                exit 0
              }
              # Count across pages: one line per pending check run.
              if ! pending="$(list_check_runs "${sha}" | awk -F'\t' '$1 != "completed"' | wc -l | tr -d '[:space:]')"; then
                exit 1
              fi
              [ "${pending}" -eq 0 ] && return 0
              [ "${elapsed}" -lt "${QUIESCE_TIMEOUT_SECONDS}" ] || {
                # Path-filtered or stuck workflows: proceed with what exists.
                echo "::warning::Checks did not quiesce within ${QUIESCE_TIMEOUT_SECONDS}s; evaluating current results."
                return 0
              }
              sleep "${QUIESCE_POLL_SECONDS}"
              elapsed=$((elapsed + QUIESCE_POLL_SECONDS))
            done
          }

          dispatch_remediation() {
            local pr_number="$1" event="$2"
            if [ "${DRY_RUN:-}" = true ]; then
              echo "::notice::Dry run: would dispatch ${AI_TASK_WORKFLOW} (task_mode=remediation, pr_number=${pr_number}, remediation_event=${event}, remediation_run_id=${REMEDIATION_RUN_ID:-none})."
              return 0
            fi
            # REST dispatch instead of 'gh workflow run': the latter probes
            # the local Git repository to resolve the workflow file, and this
            # job deliberately has no checkout (it never runs PR code).
            if ! jq -n --arg ref "${APPROVED_BASE_BRANCH}" \
                --arg mode remediation \
                --arg pr "${pr_number}" \
                --arg event "${event}" \
                --arg max "${REMEDIATION_MAX_ATTEMPTS}" \
                --arg run_id "${REMEDIATION_RUN_ID:-}" \
                '{ref: $ref, inputs: {task_mode: $mode, pr_number: $pr, remediation_event: $event, remediation_max_attempts: $max, remediation_run_id: $run_id, dry_run: "false"}}' |
                gh api "repos/${REPOSITORY}/actions/workflows/${AI_TASK_WORKFLOW}/dispatches" --input -; then
              echo "::error::Dispatching ${AI_TASK_WORKFLOW} failed (POST /repos/${REPOSITORY}/actions/workflows/${AI_TASK_WORKFLOW}/dispatches); the router needs 'actions: write'." >&2
              exit 1
            fi
            echo "::notice::Dispatched ${event} remediation for PR #${pr_number} (trigger run ${REMEDIATION_RUN_ID:-n/a})."
          }

          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            PR_NUMBER="${INPUT_PR_NUMBER}"
            [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be numeric"; exit 1; }
            if ! PR_JSON="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              echo "::error::Could not read PR #${PR_NUMBER} (GET /repos/${REPOSITORY}/pulls/${PR_NUMBER})." >&2
              exit 1
            fi
            HEAD_SHA="$(jq -r '.head.sha' <<<"${PR_JSON}")"
            HEAD_BRANCH="$(jq -r '.head.ref' <<<"${PR_JSON}")"
            if ! jq -e --arg author "${AUTOMATION_PR_AUTHOR}" --arg base "${APPROVED_BASE_BRANCH}" \
                --arg repository "${REPOSITORY}" \
                '.state == "open" and .user.login == $author and .base.ref == $base
                 and .head.repo.full_name == $repository
                 and (.head.ref | test("^ai/issue-[0-9]+$"))' \
                <<<"${PR_JSON}" >/dev/null; then
              echo "::notice::PR #${PR_NUMBER} is not an open AI pull request; nothing to recover."
              exit 0
            fi
            echo "::notice::Recovering AI PR #${PR_NUMBER} from head ${HEAD_SHA:0:12} (router run: ${RUN_URL:-})."
          else
            [[ "${TRIGGER_HEAD_BRANCH}" =~ ^ai/issue-[0-9]+$ ]] || {
              echo "::notice::Head branch is not an AI task branch; nothing to do."
              exit 0
            }
            HEAD_BRANCH="${TRIGGER_HEAD_BRANCH}"
            HEAD_SHA="${TRIGGER_HEAD_SHA}"
            PR_JSON=""
            RC=0
            PR_JSON="$(auth_pr_for_branch "${HEAD_BRANCH}")" || RC=$?
            if [ "${RC}" -ne 0 ]; then
              [ "${RC}" -eq 1 ] || exit "${RC}"
              echo "::notice::No open authorised AI PR for ${HEAD_BRANCH}; nothing to do."
              exit 0
            fi
            PR_NUMBER="$(jq -r '.number' <<<"${PR_JSON}")"
            [ "$(jq -r '.head.sha' <<<"${PR_JSON}")" = "${HEAD_SHA}" ] || {
              echo "::notice::Event head is not the PR head; dropping stale event."
              exit 0
            }
          fi

          quiesce_checks "${HEAD_SHA}" "${PR_NUMBER}"

          # Re-verify the head after quiescing: a push that lands between the
          # last poll and this check must not receive remediation for an old
          # head. Central revalidates the head authoritatively as well.
          [ "$(head_of_pr "${PR_NUMBER}")" = "${HEAD_SHA}" ] || {
            echo "::notice::PR #${PR_NUMBER} head moved after quiesce; dropping stale event."
            exit 0
          }

          CHECK_ROWS="$(list_check_runs "${HEAD_SHA}")" || exit 1
          FAILED_CHECKS="$(awk -F'\t' '$1 == "completed" && ($2 == "failure" || $2 == "timed_out" || $2 == "startup_failure" || $2 == "action_required") {print $3}' <<<"${CHECK_ROWS}" | sort -u)"
          FAILED_COUNT="$(printf '%s\n' "${FAILED_CHECKS}" | sed '/^$/d' | wc -l | tr -d '[:space:]')"

          if [ "${FAILED_COUNT}" -gt 0 ]; then
            echo "::notice::Failing checks on ${HEAD_SHA:0:12}: $(printf '%s\n' "${FAILED_CHECKS}" | sed '/^$/d' | paste -sd', ' -); dispatching remediation."
            dispatch_remediation "${PR_NUMBER}" checks-failed
            exit 0
          fi

          if [ "${EVENT_NAME}" = workflow_dispatch ] || [ "${TRIGGER_CONCLUSION:-}" != success ]; then
            echo "::notice::No failing checks found for ${HEAD_SHA:0:12}; nothing to dispatch."
            exit 0
          fi

          # All checks green on an AI PR: let Central close any open
          # remediation episode and post the ready-for-review notification.
          echo "::notice::All checks green on ${HEAD_SHA:0:12}; closing any open remediation episode."
          dispatch_remediation "${PR_NUMBER}" checks-passed
