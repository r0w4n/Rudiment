name: OpenCode AI task tests

# Executes every security regression test in scripts/opencode-ai-task/ on
# EVERY pull request (no paths filter, by design) so that changes to the
# automation cannot weaken its guarantees unnoticed, and so the check is safe
# to configure as a required status check for all pull requests. The job
# fails if any test fails.
#
# Required status check: add the job name
#   "OpenCode AI task security regression tests"
# to the "main branch protection" ruleset's required status checks
# (repository settings change, done manually).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-ai-task-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    name: OpenCode AI task security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in scripts/opencode-ai-task/*.sh; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

      - name: Run security regression tests
        run: |
          set -uo pipefail
          FAILURES=0
          for t in scripts/opencode-ai-task/test-*.sh; do
            echo "::group::${t}"
            if bash "${t}"; then
              echo "::notice::${t} passed"
            else
              echo "::error::${t} FAILED"
              FAILURES=$((FAILURES + 1))
            fi
            echo "::endgroup::"
          done
          if [ "${FAILURES}" -ne 0 ]; then
            echo "::error::${FAILURES} security regression test file(s) failed."
            exit 1
          fi
          echo "All OpenCode AI task security regression tests passed."
