[package]
name = "rudiment-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rudiment-core = { path = "../crates/core" }
leptos = { version = "=0.8.23", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "File", "FileList", "Event", "KeyboardEvent", "DragEvent", "DataTransfer", "VisibilityState", "Performance"
] }
lucide-leptos = { version = "3.63.0", features = ["accessibility", "account", "arrows", "charts", "files", "math", "multimedia", "time"] }

